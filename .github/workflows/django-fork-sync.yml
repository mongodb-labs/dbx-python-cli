name: Sync Django Fork

# Rebases each mongodb-X.Y.x branch in mongodb-forks/django onto its
# corresponding upstream Django branch, then opens a PR for review.
#
# Required secret: DJANGO_FORK_PAT
#   A GitHub personal access token with write access to mongodb-forks/django.
#   Add it at: Settings → Secrets and variables → Actions → New repository secret

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — rebase but do not push or open PRs'
        type: boolean
        default: false

jobs:
  sync:
    name: ${{ matrix.local_branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - local_branch: mongodb-6.1.x
            upstream_branch: stable/6.1.x
          - local_branch: mongodb-6.0.x
            upstream_branch: stable/6.0.x
          - local_branch: mongodb-5.2.x
            upstream_branch: stable/5.2.x
          - local_branch: main
            upstream_branch: main

    steps:
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone fork
        env:
          PAT: ${{ secrets.DJANGO_FORK_PAT }}
        run: |
          git clone "https://x-access-token:${PAT}@github.com/mongodb-forks/django.git" django
          cd django
          git remote add upstream https://github.com/django/django.git

      - name: Fetch upstream
        working-directory: django
        run: git fetch upstream ${{ matrix.upstream_branch }}

      - name: Rebase onto upstream/${{ matrix.upstream_branch }}
        id: rebase
        working-directory: django
        run: |
          git checkout ${{ matrix.local_branch }}
          BEFORE=$(git rev-parse HEAD)

          if git rebase upstream/${{ matrix.upstream_branch }}; then
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "status=unchanged" >> "$GITHUB_OUTPUT"
              echo "No new commits from upstream — nothing to do."
            else
              COUNT=$(git rev-list --count "${BEFORE}..HEAD")
              echo "status=updated"   >> "$GITHUB_OUTPUT"
              echo "count=${COUNT}"   >> "$GITHUB_OUTPUT"
              echo "before=${BEFORE}" >> "$GITHUB_OUTPUT"
              echo "Rebased ${COUNT} upstream commit(s) onto ${{ matrix.local_branch }}."
            fi
          else
            git rebase --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "Rebase failed — conflict detected."
          fi

      - name: Push sync branch
        if: steps.rebase.outputs.status == 'updated' && inputs.dry_run != 'true'
        working-directory: django
        env:
          PAT: ${{ secrets.DJANGO_FORK_PAT }}
        run: |
          SYNC_BRANCH="sync/${{ matrix.local_branch }}"
          git push "https://x-access-token:${PAT}@github.com/mongodb-forks/django.git" \
            "HEAD:refs/heads/${SYNC_BRANCH}" --force

      - name: Open or update PR
        if: steps.rebase.outputs.status == 'updated' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.DJANGO_FORK_PAT }}
          COUNT: ${{ steps.rebase.outputs.count }}
        run: |
          SYNC_BRANCH="sync/${{ matrix.local_branch }}"

          EXISTING=$(gh pr list \
            --repo mongodb-forks/django \
            --head "${SYNC_BRANCH}" \
            --base "${{ matrix.local_branch }}" \
            --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open — branch updated in place."
          else
            printf 'Automated weekly sync.\n\nRebases `%s` onto `upstream/%s`, picking up **%s** new upstream commit(s).\n\nAfter reviewing, merge with **Rebase and merge** to keep a linear history.\n' \
              "${{ matrix.local_branch }}" "${{ matrix.upstream_branch }}" "${COUNT}" \
              > /tmp/pr-body.md
            gh pr create \
              --repo mongodb-forks/django \
              --head "${SYNC_BRANCH}" \
              --base "${{ matrix.local_branch }}" \
              --title "sync: rebase ${{ matrix.local_branch }} onto upstream/${{ matrix.upstream_branch }}" \
              --body-file /tmp/pr-body.md
          fi

      - name: Open conflict issue
        if: steps.rebase.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.DJANGO_FORK_PAT }}
        run: |
          TITLE="⚠️ Rebase conflict: ${{ matrix.local_branch }} onto upstream/${{ matrix.upstream_branch }}"

          EXISTING=$(gh issue list \
            --repo mongodb-forks/django \
            --state open \
            --search "${TITLE}" \
            --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "Conflict issue #${EXISTING} already open."
          else
            gh issue create \
              --repo mongodb-forks/django \
              --title "${TITLE}" \
              --body "The automated sync workflow (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed to rebase \`${{ matrix.local_branch }}\` onto \`upstream/${{ matrix.upstream_branch }}\` due to merge conflicts. Manual resolution required."
          fi
